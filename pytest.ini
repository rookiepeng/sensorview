[pytest]
# Discovery is confined to tests/ deliberately. view_callbacks/test_case_view.py
# is a Dash view module, not a test module, but it matches the default test_*.py
# pattern. Collecting it would import app_config, which builds a Dash app and two
# FanoutCache instances on disk as an import side effect -- before a single test
# has run. Widening this path means renaming that module first.
testpaths = tests

# -ra summarises everything that did not plainly pass, so a skipped or xfailed
# test cannot hide in a wall of dots.
addopts = -ra
