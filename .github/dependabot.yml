version: 2

updates:
  # Keeps the action majors in .github/workflows current. This is the entry that
  # earns its keep today: it is what will tell you when checkout, setup-node,
  # upload-artifact or codeql-action publish a new major.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # The app's own dependencies. Electron and electron-builder move fast and
  # three.js is pinned deliberately -- a bump there is a visual change and
  # wants looking at, not merging on green.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
