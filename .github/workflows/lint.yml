name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    # Pinned: an unpinned linter turns an untouched branch red the day the tool
    # ships a new rule. Bumping this is a deliberate commit, and dependabot
    # cannot do it, so review the new findings when you raise the version.
    - name: Install ruff
      run: pip install ruff==0.16.1

    # Rules live in ruff.toml. --output-format=github annotates the offending
    # lines directly in the pull request diff.
    - name: Run ruff
      run: ruff check --output-format=github .
