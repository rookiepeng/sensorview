name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Vulnerabilities are found in queries, not only in commits, so re-scan the
  # unchanged tree weekly to pick up newly published CodeQL rules.
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest

    permissions:
      # Required to upload the results to the repository's Security tab.
      security-events: write
      contents: read

    steps:
    - uses: actions/checkout@v7

    # v4 runs on the Node 24 runtime; v3 is deprecated in December 2026.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: javascript-typescript
        # No compilation to trace: CodeQL reads the TypeScript directly, and
        # the build output in out/ would only have it scan the same code
        # twice, once bundled.
        build-mode: none

    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:python"
