name: Build App

# Controls when the workflow will run
on:
  push:
    # Triggers the workflow on push events but only for the master branch
    branches: [master]
    # A v* tag additionally publishes the builds as GitHub release assets
    tags: ["v*"]
  pull_request:
    branches: [master]
  # Allows the workflow to be started by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch makes the in-flight build obsolete; drop it
# rather than paying for two full electron-builder runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      # One platform failing should not hide the other platform's result.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: sensorview-linux
            target: --linux
          - os: windows-latest
            artifact: sensorview-windows
            target: --win

    # Git Bash ships on the Windows runners, so a single shell keeps every
    # build step identical across platforms.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The spine check: the data utility process forks and answers, and the
      # sv:// scheme honours Range. Both fail in ways only a real Electron run
      # shows, and both are what the camera panel and every reader depend on.
      # Linux runners have no display, so Electron needs a virtual one.
      - name: Smoke test
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y xvfb
            xvfb-run --auto-servernum node scripts/smoke.mjs
          else
            node scripts/smoke.mjs
          fi

      # electron-builder emits the installer and a portable/AppImage build into
      # dist/, already packaged -- there is nothing to archive by hand.
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Archive built app
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          retention-days: 1

  release:
    name: Publish release
    # Only tag builds publish, and only once both platforms have built cleanly.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      # Required to create the release and attach the built archives to it.
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download built apps
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # --clobber keeps a re-run of the same tag idempotent rather than erroring
      # on an asset that is already attached.
      - name: Publish to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh artifacts
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
