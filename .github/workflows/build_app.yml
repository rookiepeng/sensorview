name: Build App

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Allows the workflow to be started by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch makes the in-flight build obsolete; drop it
# rather than paying for two full PyInstaller runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}

    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing should not hide the other platform's result.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: sensorview-linux
          - os: windows-latest
            artifact: sensorview-windows

    # Git Bash ships on the Windows runners, so a single shell keeps every
    # build step identical across platforms.
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: PyInstaller
      run: python -m PyInstaller app.spec

    - name: Copy example
      run: cp -r ./data ./dist/sensorview/data

    # upload-artifact zips its payload and zip drops the executable bit, so the
    # Linux bundle is tarred first to keep ./sensorview runnable after download.
    # Windows has no such bit and is uploaded as a plain directory.
    - name: Package built app
      if: runner.os == 'Linux'
      run: tar -czf ${{ matrix.artifact }}.tar.gz -C ./dist sensorview

    - name: Archive built app (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: ./${{ matrix.artifact }}.tar.gz
        retention-days: 14

    - name: Archive built app (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: ./dist/sensorview
        retention-days: 14
