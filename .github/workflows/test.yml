name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: vitest
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: "24"
        cache: npm

    - name: Install dependencies
      run: npm ci

    # Types first: a type error is a faster and more precise failure than
    # whatever the tests would report downstream of it.
    - name: Typecheck
      run: npm run typecheck

    - name: Run vitest
      run: npm test
