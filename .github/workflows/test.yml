name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    # The full runtime set is needed, not just pytest: tests/test_utils.py and
    # tests/test_video_frame_mapping.py import utils and frame_sources, which
    # reach app_config and therefore dash and diskcache. There is no lighter
    # install under which those two modules import at all.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    # Configuration lives in pytest.ini, which confines discovery to tests/.
    - name: Run pytest
      run: pytest
