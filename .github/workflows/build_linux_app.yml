name: Build Linux App

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    - name: PyInstaller
      run: |
        pyinstaller app.spec
    - name: Copy example
      run: |
        cp -r ./data ./dist/sensorview/data
    # upload-artifact zips its payload and drops the executable bit, so package
    # the bundle in a tarball first to keep ./sensorview runnable after download.
    - name: Package built module
      run: |
        tar -czf sensorview-linux.tar.gz -C ./dist sensorview
    - name: Archive built module
      uses: actions/upload-artifact@v7
      if: success()
      with:
        name: sensorview-linux
        path: ./sensorview-linux.tar.gz
